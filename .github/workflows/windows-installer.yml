name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NOVA and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,desktop,voice,windows,documents,build]"
      - name: Run tests
        run: pytest -q
      - name: Build desktop application
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path $env:ProgramFiles(x86) "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc "installer/NOVA.iss"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Windows-Installer
          path: dist/NOVA-Setup-0.6.0.exe
          if-no-files-found: error
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NOVA-Setup-0.6.0.exe
