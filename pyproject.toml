[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-assistant"
version = "0.5.0"
description = "An open-source hybrid AI desktop assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "NOVA contributors" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "psutil>=6.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
desktop = [
    "PySide6>=6.8,<7.0",
]
voice = [
    "vosk>=0.3.45,<1.0",
    "sounddevice>=0.5,<1.0",
    "pyttsx3>=2.98,<3.0",
]
windows = [
    "pycaw>=20240210,<2025",
    "pywinauto>=0.6.9,<1.0",
]
documents = [
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
]

[project.scripts]
nova-desktop = "nova.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
